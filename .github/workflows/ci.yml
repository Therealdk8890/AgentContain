name: AgentContain CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install AgentContain
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m pytest -q tests -m "not integration"

  host-integration:
    name: Linux cgroup-v2 workload proof
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install AgentContain
        run: python -m pip install -e .

      - name: Inspect cgroup environment
        run: |
          uname -a
          stat -fc %T /sys/fs/cgroup
          test -f /sys/fs/cgroup/cgroup.controllers
          id

      - name: Run real workload containment proof
        env:
          AGENT_CONTAIN_RUN_REAL_CGROUP: "1"
        run: |
          sudo -E python -m pytest -q tests/integration/test_real_cgroup_execution.py
